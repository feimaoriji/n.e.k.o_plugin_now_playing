[project]
name = "now_playing"
version = "0.1.0"
# WinRT bindings for reading Windows SMTC (系统媒体会话).
# The modular winrt-* packages are split: Media.Control alone does not pull in
# Windows.Foundation, so the base namespaces it depends on are declared here
# explicitly (otherwise `request_async()` fails with ModuleNotFoundError).
dependencies = [
    "winrt-Windows.Media.Control",
    "winrt-Windows.Foundation",
    "winrt-Windows.Foundation.Collections",
]
